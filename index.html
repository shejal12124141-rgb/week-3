<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Check current weather conditions for a city.">
	<title>Weather Lookup</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202e35;
			--muted: #64747a;
			--line: #d9e1df;
			--paper: #f3f6f2;
			--green: #326754;
			--green-dark: #234b3d;
			--orange: #d77650;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		* { box-sizing: border-box; }
		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 48px 20px;
			background-color: var(--paper);
			background-image: radial-gradient(#dce5dc 1px, transparent 1px);
			background-size: 20px 20px;
			color: var(--ink);
		}
		main { width: min(100%, 760px); margin: 0 auto; }
		header { margin-bottom: 28px; }
		.eyebrow { margin: 0 0 8px; color: var(--green); font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
		h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 6vw, 3.5rem); font-weight: 500; }
		header p:last-child { max-width: 520px; margin: 12px 0 0; color: var(--muted); }
		.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
		.card { padding: 26px; border: 1px solid var(--line); border-radius: 6px; background: #fff; box-shadow: 0 12px 32px #243a3010; }
		h2 { margin: 0 0 20px; font-size: 1.12rem; }
		label { display: block; margin: 15px 0 6px; font-size: .88rem; font-weight: 700; }
		input {
			width: 100%;
			min-height: 46px;
			padding: 10px 12px;
			border: 1px solid #bfcac5;
			border-radius: 3px;
			background: #fff;
			color: var(--ink);
			font: inherit;
		}
		input:focus { outline: 3px solid #32675430; border-color: var(--green); }
		button {
			width: 100%;
			min-height: 46px;
			margin-top: 20px;
			border: 0;
			border-radius: 3px;
			background: var(--green);
			color: #fff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: var(--green-dark); }
		button:disabled { cursor: wait; opacity: .7; }
		.key-help { margin: 12px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
		.key-help a { color: var(--green); }
		.message { min-height: 24px; margin: 14px 0 0; color: #a33e2b; font-size: .9rem; }
		.result { min-height: 286px; }
		.empty { display: grid; min-height: 220px; place-items: center; color: var(--muted); text-align: center; }
		.empty p { max-width: 240px; }
		.weather { display: none; }
		.weather-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
		.location { margin: 0; font-size: 1.2rem; }
		.weather-icon { width: 76px; height: 76px; }
		.temperature { margin: 8px 0 0; color: var(--green-dark); font-family: Georgia, "Times New Roman", serif; font-size: 4rem; line-height: 1; }
		.condition { margin: 8px 0 24px; color: var(--muted); text-transform: capitalize; }
		.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
		.metric-label { display: block; color: var(--muted); font-size: .82rem; }
		.metric-value { display: block; margin-top: 4px; font-size: 1.2rem; font-weight: 700; }
		@media (max-width: 640px) {
			body { padding: 32px 16px; }
			.layout { grid-template-columns: 1fr; }
			.result { min-height: 0; }
			.empty { min-height: 120px; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">Weather lookup</p>
			<h1>Weather, right now.</h1>
			<p>Enter a city to see its current temperature, humidity, and conditions.</p>
		</header>

		<div class="layout">
			<form class="card" id="weather-form">
				<h2>Find a city</h2>
				<label for="city">City name</label>
				<input id="city" name="city" type="text" placeholder="e.g. Delhi" autocomplete="off" required>

				<label for="api-key">OpenWeatherMap API key</label>
				<input id="api-key" name="api-key" type="password" placeholder="Enter your API key" autocomplete="off" required>
				<p class="key-help">Your key is used for this request only and is not saved. Get one from <a href="https://openweathermap.org/api" target="_blank" rel="noreferrer">OpenWeatherMap</a>.</p>

				<button id="search-button" type="submit">Get weather</button>
				<p class="message" id="message" role="status" aria-live="polite"></p>
			</form>

			<section class="card result" aria-label="Weather results" aria-live="polite">
				<div class="empty" id="empty-state"><p>Weather details will appear here after you search.</p></div>
				<div class="weather" id="weather-result">
					<div class="weather-top">
						<h2 class="location" id="location">City</h2>
						<img class="weather-icon" id="weather-icon" alt="">
					</div>
					<p class="temperature"><span id="temperature">--</span>°C</p>
					<p class="condition" id="condition"></p>
					<div class="metrics">
						<div><span class="metric-label">Humidity</span><span class="metric-value" id="humidity">--%</span></div>
						<div><span class="metric-label">Feels like</span><span class="metric-value"><span id="feels-like">--</span>°C</span></div>
					</div>
				</div>
			</section>
		</div>
	</main>

	<script>
		const form = document.getElementById("weather-form");
		const button = document.getElementById("search-button");
		const message = document.getElementById("message");

		form.addEventListener("submit", async function (event) {
			event.preventDefault();

			const city = document.getElementById("city").value.trim();
			const apiKey = document.getElementById("api-key").value.trim();
			const query = new URLSearchParams({ q: city, appid: apiKey, units: "metric" });

			message.textContent = "Loading weather...";
			message.style.color = "";
			button.disabled = true;

			try {
				const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?${query}`);
				const data = await response.json();

				if (!response.ok) {
					if (response.status === 404) throw new Error("City not found. Check the spelling and try again.");
					if (response.status === 401) throw new Error("That API key is invalid or not active yet.");
					throw new Error(data.message || "Weather could not be loaded. Please try again.");
				}

				document.getElementById("location").textContent = `${data.name}, ${data.sys.country}`;
				document.getElementById("temperature").textContent = Math.round(data.main.temp);
				document.getElementById("condition").textContent = data.weather[0].description;
				document.getElementById("humidity").textContent = `${data.main.humidity}%`;
				document.getElementById("feels-like").textContent = Math.round(data.main.feels_like);

				const icon = document.getElementById("weather-icon");
				icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
				icon.alt = data.weather[0].description;
				document.getElementById("empty-state").style.display = "none";
				document.getElementById("weather-result").style.display = "block";
				message.textContent = "";
			} catch (error) {
				message.textContent = error.message || "Network error. Check your connection and try again.";
			} finally {
				button.disabled = false;
			}
		});
	</script>
</body>
</html>
